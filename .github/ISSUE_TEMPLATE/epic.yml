name: Epic
description: Define a high-level requirement category. Individual requirements can be added as sub-issues beneath this epic.
title: "[EPIC]: "
labels: ["epic"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is this epic about? Provide a high-level summary of the goal or theme it represents.
      placeholder: e.g. "All requirements related to user authentication and account management."
    validations:
      required: true
